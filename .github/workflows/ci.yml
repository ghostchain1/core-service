name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"

      - name: Download modules
        run: go mod download

      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Go files not formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build container image
        run: docker build -t core-service:ci .

      - name: Enforce non-root container user
        run: |
          image_user=$(docker image inspect core-service:ci --format '{{.Config.User}}')
          if [ -z "$image_user" ] || [ "$image_user" = "root" ] || [ "$image_user" = "0" ]; then
            echo "Container must set a non-root USER. Found: '${image_user}'"
            exit 1
          fi

          runtime_uid=$(docker run --rm core-service:ci id -u)
          if [ "$runtime_uid" = "0" ]; then
            echo "Container runtime UID must not be 0"
            exit 1
          fi

      - name: Enforce container healthcheck
        run: |
          health_test=$(docker image inspect core-service:ci --format '{{json .Config.Healthcheck.Test}}')
          if [ -z "$health_test" ] || [ "$health_test" = "null" ]; then
            echo "Container image must define HEALTHCHECK"
            exit 1
          fi
